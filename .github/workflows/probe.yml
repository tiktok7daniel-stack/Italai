name: Probe model hosting
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiteRT-LM versions on Google Maven
        run: curl -sL https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml | tr -s ' \n' | grep -o "<version>[^<]*</version>" | tail -8
      - name: Model download headers (no login)
        run: |
          for f in "gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm" "gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm"; do
            echo "== $f"
            curl -sIL "https://huggingface.co/litert-community/$f" | grep -iE "^HTTP|content-length|x-error|location: https://cas|location: https://cdn" | head -8
          done
      - name: Model repo info
        run: curl -s https://huggingface.co/api/models/litert-community/gemma-4-E2B-it-litert-lm | python3 -c "import sys,json;d=json.load(sys.stdin);print('gated:',d.get('gated'),'license:',d.get('cardData',{}).get('license'));print([s['rfilename'] for s in d.get('siblings',[])])"
